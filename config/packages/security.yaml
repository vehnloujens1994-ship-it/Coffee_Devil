security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_STAFF: ROLE_USER
        ROLE_ADMIN: ROLE_STAFF

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|static|uploads)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_auth
                check_path: app_auth
                default_target_path: app_post_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_menu

    access_control:
        - { path: ^/admin/(menu|users), roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_STAFF }
        - { path: ^/(cart|checkout|my-orders|place-order|order-success|update-cart), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10